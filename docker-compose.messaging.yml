# Optional messaging/search stack (roadmap, not required to run the app).
#
# The application code does NOT depend on these services yet — no producer,
# consumer, or indexing is wired. They are kept in this separate file so the
# default `docker compose up --build` stays light and fresher-plausible:
# Postgres + Mongo + Redis + 4 Java services + gateway + UI.
#
# Start everything (app + roadmap infra):
#   docker compose -f docker-compose.yml -f docker-compose.messaging.yml up --build -d
# Start roadmap infra only:
#   docker compose -f docker-compose.messaging.yml up -d

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: foodie-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: foodie-kafka
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: foodie-kafka-ui
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: foodie-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: [es_data:/usr/share/elasticsearch/data]

volumes:
  es_data:
