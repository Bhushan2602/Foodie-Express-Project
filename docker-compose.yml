services:
  postgres:
    image: postgres:15-alpine
    container_name: foodie-postgres
    environment:
      POSTGRES_DB: foodieexpress
      POSTGRES_USER: ${POSTGRES_USER:-foodie_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-FoodiePass123!}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodie_admin -d foodieexpress"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: foodie-mongo
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: foodie-redis
    ports: ["6379:6379"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: foodie-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: foodie-kafka
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: foodie-kafka-ui
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: foodie-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: [es_data:/usr/share/elasticsearch/data]

  user-service:
    build:
      context: ./user-service/user-service
    container_name: foodie-user-service
    ports: ["8081:8081"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/foodie_users
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-foodie_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-FoodiePass123!}
      JWT_SECRET: ${JWT_SECRET:-bXlTZWNyZXRLZXlGb3JGb29kaWVFeHByZXNzMjAyNSEhISEh}
    depends_on:
      postgres:
        condition: service_healthy

  restaurant-service:
    build:
      context: ./restaurant-service/restaurant-service
    container_name: foodie-restaurant-service
    ports: ["8082:8082"]
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/foodiedb
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started

  order-service:
    build:
      context: ./order-service/order-service
    container_name: foodie-order-service
    ports: ["8083:8083"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/foodie_orders
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-foodie_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-FoodiePass123!}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_DEMO_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway/api-gateway
    container_name: foodie-api-gateway
    ports: ["8080:8080"]
    environment:
      USER_SERVICE_URL: http://user-service:8081
      RESTAURANT_SERVICE_URL: http://restaurant-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
    depends_on:
      - user-service
      - restaurant-service
      - order-service

  foodie-express-ui:
    build:
      context: ./foodie-express-ui
    container_name: foodie-ui
    ports: ["3000:80"]
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  mongo_data:
  es_data:
